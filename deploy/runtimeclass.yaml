# The vm RuntimeClass: pods that set runtimeClassName: vm run linux/arm64
# images in a Virtualization.framework micro-VM on a darwin-vk node. The
# scheduling stanza sends them to Macs without per-pod selectors.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: vm
handler: vm
scheduling:
  nodeSelector:
    kubernetes.io/os: darwin
  tolerations:
    - key: virtual-kubelet.io/provider
      operator: Equal
      value: darwin
      effect: NoSchedule
