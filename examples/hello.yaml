apiVersion: v1
kind: Pod
metadata:
  name: hello-mac
spec:
  nodeSelector:
    kubernetes.io/os: darwin
  tolerations:
    - key: virtual-kubelet.io/provider
      operator: Equal
      value: darwin
      effect: NoSchedule
  restartPolicy: Always
  containers:
    - name: hello
      image: host            # ignored: containers run as native macOS processes
      command: ["/bin/sh", "-c"]
      args: ["while true; do echo \"hello from $(sw_vers -productVersion) $(uname -m) ($GREETING)\"; sleep 5; done"]
      env:
        - name: GREETING
          value: darwin-vk
