# One Mac, two runtimes: Postgres from Docker Hub in a Linux micro-VM, and a
# native evaluation job on the Mac's GPU that writes its results into it.
# Needs deploy/runtimeclass.yaml applied to the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: evaldb
stringData:
  POSTGRES_PASSWORD: change-me
---
apiVersion: v1
kind: Service
metadata:
  name: evaldb
spec:
  selector: {app: evaldb}
  ports:
    - port: 5432
---
apiVersion: v1
kind: Pod
metadata:
  name: evaldb
  labels: {app: evaldb}
spec:
  runtimeClassName: vm            # stock linux/arm64 image, own kernel
  containers:
    - name: postgres
      image: postgres:17-alpine
      # The image's entrypoint passes initdb its password through bash process
      # substitution, and the VM guest has no /dev/fd, so initialise directly.
      command: [sh, -c]
      args:
        - |
          set -e
          if [ ! -s "$PGDATA/PG_VERSION" ]; then
            install -d -o postgres -g postgres -m 700 "$PGDATA"
            printf '%s' "$POSTGRES_PASSWORD" > /tmp/pwfile && chown postgres /tmp/pwfile
            gosu postgres initdb -U postgres --pwfile=/tmp/pwfile --auth-host=scram-sha-256
            rm /tmp/pwfile
            echo "host all all all scram-sha-256" >> "$PGDATA/pg_hba.conf"
          fi
          exec gosu postgres postgres -c listen_addresses='*'
      envFrom:
        - secretRef: {name: evaldb}
      ports:
        - containerPort: 5432     # forwarded on the node IP
      resources:
        limits: {cpu: "2", memory: 1Gi}   # the VM's size: 2 vCPUs, 1 GiB
      readinessProbe:
        exec:
          command: [pg_isready, -U, postgres]
        periodSeconds: 5
---
apiVersion: v1
kind: Pod
metadata:
  name: eval
spec:
  # No runtimeClassName: a native macOS process with Metal and MLX.
  nodeSelector:
    kubernetes.io/os: darwin
  tolerations:
    - key: virtual-kubelet.io/provider
      operator: Equal
      value: darwin
      effect: NoSchedule
  restartPolicy: Never
  containers:
    - name: eval
      image: registry.example.com/ml/mlx-eval:1   # a darwin/arm64 image
      env:
        # Without --pod-network, Mac pods share the node's network, so the
        # VM's forwarded port is on localhost. With --pod-network=flannel, use
        # postgres://postgres@evaldb:5432/postgres instead.
        - name: DATABASE_URL
          value: postgres://postgres@127.0.0.1:5432/postgres
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef: {name: evaldb, key: POSTGRES_PASSWORD}
      resources:
        limits:
          mlx.k3sm.io/gpu: "1"
          memory: 16Gi
